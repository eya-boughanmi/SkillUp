spring.application.name=backend

spring.datasource.url=jdbc:mysql://localhost:3306/skillup
spring.datasource.username=root
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Ne pas modifier automatiquement les tables existantes
spring.jpa.hibernate.ddl-auto=none

# XAMPP fournit MariaDB. Sans cette ligne, Hibernate croit voir un vieux MySQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PDF d'autorisation du recruteur : 5 Mo maximum, comme le formulaire
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Dossier des PDF, relatif au dossier backend au lancement
skillup.upload-dir=uploads
